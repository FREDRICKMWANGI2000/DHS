services:
  postgres:
    image: postgres:18
    container_name: dsh_postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dsh_db}
      POSTGRES_USER: ${POSTGRES_USER:-dsh_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - dsh_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-dsh_user} -d $${POSTGRES_DB:-dsh_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  dsh_postgres_data:
    name: dsh_postgres_data
